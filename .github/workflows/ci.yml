name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate data
        run: python -m src.fraudml.generate --rows 2000
      - name: Train and evaluate
        run: python -m src.fraudml.model
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: model-evidence
          path: |
            models/fraud_model.json
            reports/metrics.json

